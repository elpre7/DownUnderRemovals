<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review carousel — mock data harness (dev only)</title>
<link rel="stylesheet" href="styles.css">
<style>body{background:#0a1a2e;padding:0}</style>
</head>
<body>
<p style="color:white;font:14px system-ui;padding:16px 24px;margin:0">Dev-only harness: renders the carousel against <code>reviews.mock.js</code> edge cases. Not linked from index.html, never shipped as a "page" of the site.</p>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<main>
<section class="reviews-section-wrap">
  <aside class="review-carousel" id="reviews">
    <div class="review-carousel-inner">
      <div class="review-intro">
        <span class="google-logo" aria-hidden="true">G</span>
        <h3>What our customers say</h3>
        <div class="review-rating-row"><span class="rating-number" data-slot="rating-number">–</span><span class="rating-stars" aria-hidden="true">★★★★★</span></div>
        <p class="rating-count" data-slot="rating-count">Loading reviews…</p>
        <div class="carousel-controls">
          <button type="button" data-dir="prev" aria-label="Previous reviews"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
          <button type="button" data-dir="next" aria-label="Next reviews"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
        </div>
      </div>
      <div class="review-viewport" role="region" aria-label="Google customer reviews">
        <div class="review-track"></div>
      </div>
    </div>
  </aside>
</section>
</main>

<script type="module">
  import { mountReviewCarousel } from "./review-carousel.js";
  import { mockReviews } from "./reviews.mock.js";
  mountReviewCarousel(document.getElementById("reviews"), mockReviews);
</script>
</body>
</html>
